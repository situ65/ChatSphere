
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Realtime Chat</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Your CSS -->
    <link rel="stylesheet" href="/css/chat.css">

    <!-- SockJS -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>

    <!-- STOMP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>

<body>

<div class="chat-wrapper">

    <div class="chat-card">

        <!-- HEADER -->
        <div class="chat-header">

            <div class="brand">

                <div class="brand-icon">
                    <i class="bi bi-chat-dots-fill"></i>
                </div>

                <div>
                    <h2> ChatSphere</h2>
                    <small> Connect • Chat • Share</small>
                </div>

            </div>

            <div class="connection">

                <span id="status-dot" class="status-dot"></span>

                <span id="status-text">
                    Connecting...
                </span>

            </div>

        </div>


        <!-- USER NAME -->
        <div class="user-section">

            <div class="input-label">
                <i class="bi bi-person"></i>
                Your Name
            </div>

            <input
                    type="text"
                    id="senderInput"
                    class="form-control"
                    placeholder="Enter your name..."
                    maxlength="30">

        </div>


        <!-- CHAT -->
        <div id="chat" class="chat-container">

            <div id="empty-chat" class="empty-chat">

                <i class="bi bi-chat-square-text"></i>

                <h5>No messages yet</h5>

                <p>Start the conversation!</p>

            </div>

        </div>


        <!-- MESSAGE INPUT -->
        <div class="message-section">

            <div class="message-input-wrapper">

                <input
                        type="text"
                        id="messageInput"
                        class="form-control"
                        placeholder="Type a message..."
                        maxlength="500"
                        disabled>

                <button
                        type="button"
                        id="send-button"
                        class="send-btn"
                        disabled>

                    <i class="bi bi-send-fill"></i>

                </button>

            </div>

            <div class="input-hint">
                Press <b>Enter</b> to send
            </div>

        </div>


        <!-- FOOTER -->
        <div class="chat-footer">

            <span>
                <i class="bi bi-chat"></i>

                <span id="message-count">0</span>
                messages
            </span>

            <button
                    type="button"
                    class="clear-btn"
                    id="clear-button">

                <i class="bi bi-trash3"></i>
                Clear Chat

            </button>

        </div>

    </div>

</div>


<script>

    let stompClient = null;

    let messageCount = 0;

    let currentUser = "";


    // -----------------------------
    // CONNECTION STATUS
    // -----------------------------

    function setConnected(connected) {

        const sendButton =
            document.getElementById("send-button");

        const messageInput =
            document.getElementById("messageInput");

        const statusDot =
            document.getElementById("status-dot");

        const statusText =
            document.getElementById("status-text");


        sendButton.disabled = !connected;

        messageInput.disabled = !connected;


        if (connected) {

            statusDot.classList.add("online");

            statusText.textContent = "Connected";

        } else {

            statusDot.classList.remove("online");

            statusText.textContent = "Disconnected";

        }

    }


    // -----------------------------
    // CONNECT
    // -----------------------------

    function connect() {

        const socket = new SockJS('/chat');

        stompClient = Stomp.over(socket);

        stompClient.debug = null;


        stompClient.connect(
            {},
            function (frame) {

                console.log("Connected:", frame);

                setConnected(true);


                stompClient.subscribe(
                    '/topic/messages',
                    function (message) {

                        const data =
                            JSON.parse(message.body);

                        showMessage(data);

                    }
                );

            },
            function (error) {

                console.error(
                    "WebSocket error:",
                    error
                );

                setConnected(false);

            }
        );

    }


    // -----------------------------
    // SHOW MESSAGE
    // -----------------------------

    function showMessage(message) {

        const chat =
            document.getElementById("chat");


        const emptyChat =
            document.getElementById("empty-chat");


        if (emptyChat) {

            emptyChat.remove();

        }


        const messageElement =
            document.createElement("div");


        /*
         * IMPORTANT:
         *
         * If sender == current user
         * message goes RIGHT
         *
         * Otherwise
         * message goes LEFT
         */

        if (
            message.sender.toLowerCase() ===
            currentUser.toLowerCase()
        ) {

            messageElement.className =
                "message message-right";

        } else {

            messageElement.className =
                "message message-left";

        }


        // Username

        const userElement =
            document.createElement("div");

        userElement.className =
            "message-user";

        userElement.textContent =
            message.sender;


        // Bubble

        const bubble =
            document.createElement("div");

        bubble.className =
            "message-bubble";


        // Content

        const contentElement =
            document.createElement("div");

        contentElement.className =
            "message-content";

        contentElement.textContent =
            message.content;


        // Time

        const timeElement =
            document.createElement("div");

        timeElement.className =
            "message-time";

        timeElement.textContent =
            getCurrentTime();


        bubble.appendChild(contentElement);

        bubble.appendChild(timeElement);


        messageElement.appendChild(userElement);

        messageElement.appendChild(bubble);


        chat.appendChild(messageElement);


        // Count

        messageCount++;

        document.getElementById(
            "message-count"
        ).textContent = messageCount;


        // Scroll

        chat.scrollTop =
            chat.scrollHeight;

    }


    // -----------------------------
    // TIME
    // -----------------------------

    function getCurrentTime() {

        return new Date().toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    }


    // -----------------------------
    // SEND MESSAGE
    // -----------------------------

    function sendMessage() {

        if (!stompClient) {
            return;
        }


        const sender =
            document.getElementById(
                "senderInput"
            ).value.trim();


        const content =
            document.getElementById(
                "messageInput"
            ).value.trim();


        if (sender === "") {

            alert("Please enter your name.");

            document.getElementById(
                "senderInput"
            ).focus();

            return;

        }


        if (content === "") {
            return;
        }


        /*
         * Save current user
         */

        currentUser = sender;


        const chatMessage = {

            sender: sender,

            content: content

        };


        stompClient.send(

            "/app/sendMessage",

            {},

            JSON.stringify(chatMessage)

        );


        document.getElementById(
            "messageInput"
        ).value = "";


        document.getElementById(
            "messageInput"
        ).focus();

    }


    // -----------------------------
    // SEND BUTTON
    // -----------------------------

    document.getElementById(
        "send-button"
    ).addEventListener(
        "click",
        sendMessage
    );


    // -----------------------------
    // ENTER KEY
    // -----------------------------

    document.getElementById(
        "messageInput"
    ).addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    // -----------------------------
    // SAVE USER NAME
    // -----------------------------

    document.getElementById(
        "senderInput"
    ).addEventListener(
        "input",
        function () {

            currentUser =
                this.value.trim();

        }
    );


    // -----------------------------
    // CLEAR CHAT
    // -----------------------------

    document.getElementById(
        "clear-button"
    ).addEventListener(
        "click",
        function () {

            document.getElementById(
                "chat"
            ).innerHTML = `

                <div id="empty-chat"
                     class="empty-chat">

                    <i class="bi bi-chat-square-text"></i>

                    <h5>No messages yet</h5>

                    <p>Start the conversation!</p>

                </div>

            `;


            messageCount = 0;


            document.getElementById(
                "message-count"
            ).textContent = "0";

        }
    );


    // -----------------------------
    // START
    // -----------------------------

    window.addEventListener(
        "load",
        connect
    );

</script>

</body>
</html>
